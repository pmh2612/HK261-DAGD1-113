# BT7 - semantic search (EXPERIMENT_PLAN.md §4). Model names checked on Hugging Face on
# 2026-10-27. Prefixes follow each model card; they are part of the model, not tuning.
# FAISS IndexFlatIP (exact) for all; HNSW / IVF only matter at `medium`.
task: bt7
models:
  - name: minilm
    id: sentence-transformers/all-MiniLM-L6-v2
  - name: bge-small
    id: BAAI/bge-small-en-v1.5
    query_prefix: "Represent this sentence for searching relevant passages: "
  - name: bge-base
    id: BAAI/bge-base-en-v1.5
    query_prefix: "Represent this sentence for searching relevant passages: "
  - name: e5-small
    id: intfloat/e5-small-v2
    query_prefix: "query: "
    doc_prefix: "passage: "
  - name: specter2  # allenai/specter2_base + adapters, encoded in .venv-specter2
    precomputed: true
